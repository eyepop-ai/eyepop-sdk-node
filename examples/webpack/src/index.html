<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="dark">
    <title>Stream your Webcam</title>
    <link href="main.css" rel="stylesheet">
    <style>
        :root {
            --bg: #0e1116;
            --panel: #161b22;
            --raised: #1e252e;
            --line: #2a323d;
            --text: #e6e9ee;
            --muted: #8b95a3;
            --accent: #4f8cff;
            --accent-hover: #6a9fff;
            --ok: #3fb97f;
            --danger: #e5534b;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            background: var(--bg);
            color: var(--text);
            font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        }

        .app { max-width: 1280px; margin: 0 auto; padding: 12px 16px 20px; }

        header { display: flex; align-items: center; gap: 10px; padding: 4px 0 12px; }
        header img { height: 26px; filter: brightness(1.4) saturate(1.15); }
        header h1 { font-size: 15px; font-weight: 600; margin: 0; letter-spacing: .01em; }
        .pill {
            margin-left: auto; display: inline-flex; align-items: center; gap: 6px;
            padding: 3px 10px; border-radius: 999px; background: var(--panel);
            border: 1px solid var(--line); color: var(--muted); font-size: 12px;
        }
        .pill::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--muted); }
        .pill[data-on]::before { background: var(--ok); box-shadow: 0 0 0 3px rgba(63, 185, 127, .18); }
        #pop-name:empty::after { content: "not connected"; }

        .toolbar {
            display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px;
            padding: 8px 10px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
        }
        .group { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
        .group + .group { padding-left: 14px; border-left: 1px solid var(--line); }
        .label { color: var(--muted); font-size: 12px; margin-right: 2px; }

        button, select {
            font: inherit; color: var(--text); background: var(--raised);
            border: 1px solid var(--line); border-radius: 7px; padding: 5px 12px; height: 30px;
        }
        select { max-width: 240px; padding-right: 6px; }
        button { cursor: pointer; transition: background .12s, border-color .12s; }
        button:hover:not(:disabled) { border-color: #3a4552; background: #252d38; }
        button:focus-visible, select:focus-visible, .seg input:focus-visible + span, .switch input:focus-visible + span {
            outline: 2px solid var(--accent); outline-offset: 1px;
        }
        button:disabled { opacity: .4; cursor: not-allowed; }
        #connect, #start-stream { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
        #connect:hover:not(:disabled), #start-stream:hover:not(:disabled) { background: var(--accent-hover); border-color: var(--accent-hover); }
        #stop-stream:not(:disabled) { color: var(--danger); border-color: rgba(229, 83, 75, .5); }

        .seg { display: inline-flex; background: var(--raised); border: 1px solid var(--line); border-radius: 7px; overflow: hidden; }
        .seg label { margin: 0; }
        .seg input, .switch input { position: absolute; opacity: 0; pointer-events: none; }
        .seg span { display: block; padding: 5px 10px; height: 28px; line-height: 18px; cursor: pointer; color: var(--muted); font-size: 12px; }
        .seg label + label span { border-left: 1px solid var(--line); }
        .seg input:checked + span { background: var(--accent); color: #fff; }
        .seg input:not(:checked) + span:hover { color: var(--text); background: #252d38; }

        .switch { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; color: var(--muted); font-size: 12px; }
        .switch span::before {
            content: ""; display: inline-block; width: 30px; height: 17px; border-radius: 999px; vertical-align: -4px;
            background: var(--raised); border: 1px solid var(--line);
            background-image: radial-gradient(circle, var(--muted) 5px, transparent 5.5px);
            background-size: 17px 17px; background-repeat: no-repeat; background-position: 1px center;
            margin-right: 8px; transition: background-position .12s;
        }
        .switch input:checked + span { color: var(--text); }
        .switch input:checked + span::before { background-color: rgba(79, 140, 255, .35); border-color: var(--accent); background-image: radial-gradient(circle, #fff 5px, transparent 5.5px); background-position: 14px center; }

        .main { display: grid; grid-template-columns: minmax(0, 3fr) minmax(280px, 2fr); gap: 12px; margin-top: 12px; align-items: start; }
        @media (max-width: 860px) { .main { grid-template-columns: 1fr; } .group + .group { padding-left: 0; border-left: 0; } select { max-width: 100%; flex: 1 1 140px; } }

        .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
        .card h2 { display: flex; align-items: center; margin: 0; padding: 8px 12px; font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; border-bottom: 1px solid var(--line); }
        #timing { margin-left: auto; text-transform: none; letter-spacing: 0; font-size: 12px; font-weight: 600; font-variant-numeric: tabular-nums; color: var(--text); background: var(--raised); border: 1px solid var(--line); border-radius: 999px; padding: 1px 9px; }

        .preview-wrapper { min-height: 12rem; background: #000; }
        .local-video { border: 0; background: #000; }

        #txt_json {
            margin: 0; padding: 10px 12px; height: 420px; overflow: auto; background: transparent; color: #c9d4e3; border: 0;
            font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; white-space: pre-wrap; word-break: break-word;
        }
        @media (max-width: 860px) { #txt_json { height: 240px; } }
        .text-muted { color: var(--muted); }
    </style>
</head>

<body>
    <div class="app">
        <header>
            <a href="1_upload_image.html"><img src="images/eyepop-logo.svg" alt="EyePop.ai"></a>
            <h1>Stream your webcam</h1>
            <span class="pill"><span id="pop-name"></span></span>
        </header>
        <div id="camera-status" class="text-muted" style="padding:0 16px 6px;font-size:12px" role="status"></div>

        <div class="toolbar">
            <div class="group">
                <button disabled id="connect">Connect</button>
                <button id="allow-camera" title="Ask the browser for access to the camera">Allow camera</button>
                <select id="video_device" aria-label="Video source"></select>
                <button disabled id="start-stream">Start</button>
                <button disabled id="stop-stream">Stop</button>
            </div>
            <div class="group">
                <span class="label">Motion detect</span>
                <div class="seg">
                    <label><input checked type="radio" name="motion-detect-options" id="motion-detect-0" value="0"><span>Off</span></label>
                    <label><input type="radio" name="motion-detect-options" id="motion-detect-1" value="0.5"><span>50%</span></label>
                    <label><input type="radio" name="motion-detect-options" id="motion-detect-2" value="0.75"><span>75%</span></label>
                    <label><input type="radio" name="motion-detect-options" id="motion-detect-3" value="0.999"><span>99.9%</span></label>
                </div>
            </div>
            <div class="group">
                <label class="switch"><input type="checkbox" role="switch" id="roi-switch"><span>ROI (160, 0) 320x480</span></label>
            </div>
        </div>

        <div class="main">
            <section class="card">
                <h2>Local video</h2>
                <div class="preview-wrapper">
                    <video class="local-video" id="local-video" type="application/x-mpegURL" muted autoplay playsinline controls></video>
                    <canvas class="result-overlay" id="local-result-overlay"></canvas>
                </div>
            </section>
            <section class="card">
                <h2>Results <span id="timing">0ms</span></h2>
                <pre id="txt_json"><span class="text-muted">{ ...JSON will appear here... }</span></pre>
            </section>
        </div>
    </div>
</body>

</html>
